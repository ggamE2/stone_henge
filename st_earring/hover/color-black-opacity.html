<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Untitled Document</title>
<style type="text/css">
p,h1,h2,h3,h4,h5,h6,ul,li{margin:0 ;padding:0;}
.list {
      list-style:none;
      margin:0;
      padding:0;
     }
	 
.list li{float:left;margin:10px;position:relative;}	 
.list li .caption{width:300px;height:200px;background:rgba(0,0,0,0.5);color:#fff;line-height:2;text-align:center;padding-top:20px;box-sizing:border-box;position:absolute;top:0;left:0;opacity:0;transition:all 0.5s;}
.list li:hover .caption{opacity:1;}
</style>
</head>

<body>
<h1>신상품 목록</h1>
<div id="container">
<ul class="list">
      <li>
        <img src="images/prod1.jpg">   
         <div class="caption">
          <h1>상품 1</h1>
          <p>상품 1 설명 텍스트</p>
          <p>가격 : 12,345원</p>
        </div>    
      </li>
      
      <li>
        <img src="images/prod2.jpg">  
        <div class="caption">
          <h1>상품 2</h1>
          <p>상품 2 설명 텍스트</p>
          <p>가격 : 12,345원</p>
        </div>      
      </li>
      
      <li>
        <img src="images/prod3.jpg">  
        <div class="caption">
          <h1>상품 3</h1>
          <p>상품 3 설명 텍스트</p>
          <p>가격 : 12,345원</p>
        </div>      
      </li>
    </ul>
</div>
</body>
</html>
