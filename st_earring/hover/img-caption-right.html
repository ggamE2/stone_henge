<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>img-caption-left.html</title>
<style>
  #wrapper {
	  width:500px;height:auto;margin:50px auto;}
  .box {
	  border:4px solid #ccc;position:relative;
    width:350px;height:300px;overflow:hidden;}
  .box .photo {position:absolute;left:0;top:0;}
  .box .caption {
	position:absolute;
    background: rgba(0,0,0,0.4);color: #fff;
    width:200px;height:300px;
	right:-250px;top:0;
	padding:20px;
    -webkit-transition: all 300ms linear;
    -moz-transition: all 300ms linear;
    -o-transition: all 300ms linear;
    transition: all 300ms linear;}
  .box .caption p {position:absolute;bottom:50px;}
  .box:hover .caption {
    -webkit-transform: translateX(-100%);
    -moz-transform:translateX(-100%);
    -ms-transform:translateX(-100%);
    -o-transform:translateX(-100%);
    transform: translateX(-100%);
  }
  .box .photo{
    position:absolute;
    left:0;
    -webkit-transition: all 300ms ease;
    -moz-transition: all 300ms ease;
    -o-transition: all 300ms ease;
    transition: all 300ms ease;
  }
  .box:hover .photo{
	-webkit-transform:translateX(-20px);
    -moz-transform:translateX(-20px);
    -ms-transform:translateX(-20px);
    -o-transform:translateX(-20px);
	transform: translateX(-20px);
  }
</style>
</head>

<body>
<div id="wrapper">
    <div class="box">
      <img src="images/friends.jpg" class="photo">
      <div class="caption">
        <p>친구란, <br> 두 몸에 깃든 하나의 영혼.</p>
      </div>
    </div>
  </div>
</body>
</html>
