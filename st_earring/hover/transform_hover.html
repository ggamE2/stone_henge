<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Untitled Document</title>
<style type="text/css">
.box1{width:30px;
    height:16px;
    /*background:pink;*/
    margin-top:30px;}
.box1 p{
  margin:0 0 3px 0;   
  width:30px;
  height:3px;
  background:rgba(18,150,193,1);
  border:none;transition: all 0.5s;}
.box1:hover .x1{
    transform:rotate(45deg);
    /*margin-top:15px;*/
    position:relative;
    top:6px;}
.box1:hover .x2{opacity:0;}
.box1:hover .x3{
    transform:rotate(-45deg);
    margin-top:-0px;
    position:relative;
    top:-6px;}
 
    
    
 /* -----------------------*/   
    
.line_bottom, .line_bottom1{
 width:100px;
 height:50px;
 background:lightgray;
 border:1px solid gray;
 } 
    
.line_bottom{
 position:relative;
 width:100px;
 float:left;}
    
.line_bottom span.txt1{
  display:block;
  background:rgba(18,150,193,1);
  width:0px;
  height:5px;
  position:absolute;
  bottom:0;
  transition:all 0.5s;}
    
.line_bottom:hover span.txt1{
 width:100px;}
    
.line_bottom span.txt2{
 z-index:2;
 position:absolute;
 top:13px;
 left:30px;}
a .line_bottom{
 color:#000;}
a .line_bottom:hover{
 color:#fff;}

   
 /* -------------------------*/   
    
 
.line_bottom1{
 position:relative;
 width:100px;
 float:left;
 clear:both;}
    
.line_bottom1 span.txt1{
 display:block;
 background:rgba(18,150,193,1);
 width:0px;
 height:50px;
 position:absolute;
 top:0;
 transition:all 0.5s;}
    
.line_bottom1:hover span.txt1{
 width:100px;}
    
.line_bottom1 span.txt2{
 z-index:2;
 position:absolute;
 top:13px;
 left:30px;}
    
a .line_bottom1 {
 color:#000;}
    
a .line_bottom1:hover {
 color:#fff;}
</style>    
</head>

<body>

<div class="box1">
  <p class="x1"></p>
  <p class="x2"></p>
  <p class="x3"></p>
</div>

<a href="#"><p class="line_bottom">
  <span class="txt1"></span>
  <span class="txt2">내용</span> 
</p></a>
  
<a href="#"><p class="line_bottom1">
  <span class="txt1"></span>
  <span class="txt2">내용</span>
</p></a>
     
</body>
</html>
