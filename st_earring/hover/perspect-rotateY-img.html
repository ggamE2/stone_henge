<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Untitled Document</title>
<style type="text/css">
	.box {
		-webkit-transition: 500ms ease-in;
		-moz-transition: 500ms ease-in;
		-o-transition: 500ms ease-in;
		transition: 500ms ease-in;
	}
	.box:hover {
		-webkit-transform:  perspective(300px) rotateY(180deg);
		-moz-transform:  perspective(300px) rotateY(180deg);
		-o-transform:  perspective(300px) rotateY(180deg);
		-ms-transform:  perspective(300px) rotateY(180deg);
		transform:  perspective(300px) rotateY(180deg);		
        opacity:1;
	}
   .box{text-align:center;position:relative;width:200px;height:220px;}
	img{width:200px;height:220px;}
	.box .caption {
      position:absolute;opacity:0;
      color: #fff;
      width:200px;
      height:220px;
      left:0px;top:0px;
      background:#11bcdb;
	  }
	  .box:hover .caption {
        opacity:1;
    }
	.box h1, .box p{transform:  perspective(300px) rotateY(-180deg);}
	
	
	/* ---------------------------------------------  */
	.box2 {
		-webkit-transition: 500ms ease-in;
		-moz-transition: 500ms ease-in;
		-o-transition: 500ms ease-in;
		transition: 500ms ease-in;
	}
	.box2:hover {
		-webkit-transform:  perspective(300px) rotateY(360deg);
		-moz-transform:  perspective(300px) rotateY(360deg);
		-o-transform:  perspective(300px) rotateY(360deg);
		-ms-transform:  perspective(300px) rotateY(360deg);
		transform:  perspective(300px) rotateY(360deg);		
        opacity:1;
	}
   .box2{text-align:center;position:relative;width:200px;height:220px;}
	img{width:200px;height:220px;}
	.box2 .caption {
      position:absolute;opacity:0;
      color: #fff;
      width:200px;
      height:220px;
      left:0px;top:0px;
      background:#11bcdb;
	  }
	  .box2:hover .caption {
        opacity:1;
    }
</style>
</head>

<body>
<div class="box">
<a href="#"><img src="images/coffee.jpg" alt=""></a>
	<div class="caption">
          <h1>상품 1</h1>
          <p>상품 1 설명 텍스트</p>
          <p>가격 : 12,345원</p>
     </div>
</div>

<div class="box2">
<a href="#"><img src="images/coffee.jpg" alt=""></a>
	<div class="caption">
          <h1>상품 1</h1>
          <p>상품 1 설명 텍스트</p>
          <p>가격 : 12,345원</p>
     </div>
</div>
</body>
</html>
